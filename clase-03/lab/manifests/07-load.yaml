# Generador de carga para el HPA. Lleva límites para no quitarle memoria ni CPU
# a la videollamada que corre en el mismo equipo que el clúster.
apiVersion: v1
kind: Pod
metadata:
  name: load
  namespace: tienda
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -O /dev/null http://api:8000/productos; done"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
