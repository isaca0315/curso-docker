apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: tienda
spec:
  ingressClassName: nginx
  rules:
    - host: tienda.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
