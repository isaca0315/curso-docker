# Valores por defecto del chart. Se cambian con --set o con un archivo -f.
replicaCount: 2

image:
  repository: tienda-api
  tag: "3.0"
  pullPolicy: IfNotPresent

appVersion: "3.0"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
