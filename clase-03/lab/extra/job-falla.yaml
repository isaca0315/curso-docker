# Job que falla a propósito. Con backoffLimit: 0 no reintenta.
apiVersion: batch/v1
kind: Job
metadata:
  name: falla
  namespace: tienda
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: falla
          image: busybox:1.36
          command: ["sh", "-c", "echo fallo deliberado; exit 1"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
