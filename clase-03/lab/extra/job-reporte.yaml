# Job de una sola ejecución: consulta la base y termina.
# Si falla, Kubernetes lo reintenta hasta backoffLimit.
apiVersion: batch/v1
kind: Job
metadata:
  name: reporte
  namespace: tienda
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: reporte
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          command: ["sh", "-c"]
          args:
            - psql -h db -U tienda -d tienda -tAc "select count(*) || ' productos, valor ' || coalesce(sum(precio), 0) from productos;"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
