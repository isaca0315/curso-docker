# Pod que pide más CPU de la que el LimitRange permite por contenedor.
# Con el LimitRange de extra/cuota.yaml, el API Server lo rechaza al crearlo.
apiVersion: v1
kind: Pod
metadata:
  name: caro
  namespace: tienda
spec:
  restartPolicy: Never
  containers:
    - name: caro
      image: busybox:1.36
      command: ["sleep", "60"]
      resources:
        limits:
          cpu: "1"
          memory: 128Mi
