# Pod cuyos requests de CPU no caben en la cuota del namespace.
# Con la cuota de extra/cuota.yaml, el API Server lo rechaza al crearlo.
apiVersion: v1
kind: Pod
metadata:
  name: mucha-cpu
  namespace: tienda
spec:
  restartPolicy: Never
  containers:
    - name: mucha-cpu
      image: busybox:1.36
      command: ["sleep", "60"]
      resources:
        requests:
          cpu: 400m
          memory: 64Mi
        limits:
          cpu: 400m
          memory: 128Mi
