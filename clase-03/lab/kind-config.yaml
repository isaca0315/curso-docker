kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: curso
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18020
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
