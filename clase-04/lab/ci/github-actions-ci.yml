      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io \
      #       -u "${{ github.actor }}" --password-stdin
      #     docker tag tienda-api:4.0 ghcr.io/${{ github.repository }}/tienda-api:4.0
      #     docker push ghcr.io/${{ github.repository }}/tienda-api:4.0
